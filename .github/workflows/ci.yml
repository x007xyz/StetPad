name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Packing only bundles workspace sources; the app loads better-sqlite3 from desktop/node_modules.
      # Skipping install scripts avoids compiling it for Node, which needs Visual Studio on Windows.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/web build
      - name: Point npm and Electron caches at one directory
        run: |
          echo "npm_config_cache=$RUNNER_TEMP/desktop-cache/npm" >> "$GITHUB_ENV"
          echo "ELECTRON_CACHE=$RUNNER_TEMP/desktop-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/desktop-cache/electron-builder" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/desktop-cache
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Pack the desktop app
        working-directory: desktop
        run: npm run pack
        env:
          # Code signing. Leave the secrets unset to build unsigned.
          #   Windows: CSC_LINK (base64 .pfx or URL) + CSC_KEY_PASSWORD
          #   macOS:   CSC_LINK + CSC_KEY_PASSWORD, and remove `mac.identity: null` in desktop/package.json
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Smoke test the packaged app
        working-directory: desktop
        run: npm run smoke:packed
