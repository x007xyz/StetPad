name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - name: Install and pack the desktop app
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-rebuild -f -w better-sqlite3 || true
          npm run pack
        env:
          # Code signing. Leave the secrets unset to build unsigned.
          #   Windows: CSC_LINK (base64 .pfx or URL) + CSC_KEY_PASSWORD
          #   macOS:   CSC_LINK + CSC_KEY_PASSWORD, and remove `mac.identity: null` in desktop/package.json
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Smoke test the packaged app
        working-directory: desktop
        shell: bash
        run: npm run smoke:packed
